name: Skool connection test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skool-login-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'goosify/dispatch-public-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CI_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Check login and restoration without changing events
        run: pnpm exec tsx scripts/skool/check-login.ts
        env:
          WORKER_CONFIG: ${{ secrets.WORKER_CONFIG }}
          SKOOL_STORAGE_STATE: ${{ secrets.SKOOL_STORAGE_STATE }}
